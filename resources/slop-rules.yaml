# Slop selection rules, evaluated in order. This is the authoritative policy
# for deciding how positional paths and .slopignore directives compose.
#
# The DSL deliberately separates a rule's condition (`when`) from its effects
# (`then`). New selection policies should be added here and implemented through
# `rules_manifest::policy_for`, rather than added as unrecorded precedence in a
# walker.
version: 1

rules:
  # A named file is an intentional request. It bypasses .slopignore and
  # .gitignore patterns, but still obeys command-line --exclude patterns.
  - id: direct-file
    when:
      input: file
    then:
      apply_excludes: true
      apply_ignore_patterns: false
      run_include_directives: true
      include_precedence: force

  # `slop -r directory/` walks the entire directory tree. Both ignore systems
  # prune ordinary traversal, while `+ pattern` / `slopinclude pattern` runs
  # afterward and restores matching text files, including files below a pruned
  # directory.
  - id: recursive-directory
    when:
      input: directory
      recursive: true
    then:
      depth: unlimited
      apply_excludes: true
      apply_ignore_patterns: true
      run_include_directives: true
      include_precedence: force

  # `slop .` without -r is atmospheric slopping of the current directory. It
  # includes files in the directory and its immediate child directories, but
  # not deeper descendants. A missing .slopignore means this ordinary shallow
  # walk, not an implicit recursive or include-directed walk.
  - id: shallow-current-directory
    when:
      input: directory
      recursive: false
      current_directory: true
    then:
      depth: current-directory-shallow
      apply_excludes: true
      apply_ignore_patterns: true
      run_include_directives: true
      include_precedence: force

  # A named directory without -r is shallower than `.`: only its direct files
  # are selected. This keeps `slop src/` predictable while preserving the
  # historical convenience behavior of `slop .`.
  - id: shallow-named-directory
    when:
      input: directory
      recursive: false
      current_directory: false
    then:
      depth: direct-files
      apply_excludes: true
      apply_ignore_patterns: true
      run_include_directives: true
      include_precedence: force
